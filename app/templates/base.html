<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sentinel{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/sentinel.css?v=3">
  <script src="/static/vendor/htmx.min.js"></script>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% if user %}/dashboard{% else %}/login{% endif %}">Sentinel</a>
    {% if user %}
    <input id="nav-toggle" class="nav-toggle" type="checkbox">
    <label class="nav-button" for="nav-toggle">Menu</label>
    <nav class="nav">
      <a href="/dashboard">Tableau de bord</a>
      <a href="/discovery">Découverte</a>
      <a href="/admin/view">Administration</a>
      <a href="/docs">API / Swagger</a>
      <form method="post" action="/logout">
        <button type="submit">Déconnexion</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  {% block vendor %}{% endblock %}
  <script src="/static/js/sentinel.js"></script>
</body>
</html>
